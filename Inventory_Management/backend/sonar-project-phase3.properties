# SonarQube project metadata
sonar.projectKey=inventory-management-phase3
sonar.projectName=Inventory management phase 3
sonar.projectVersion=3.0

# Source encoding
sonar.sourceEncoding=UTF-8

# Phase 3 scope (agent runtime and tooling)
sonar.sources=agent
sonar.tests=rag/tests
sonar.test.inclusions=rag/tests/test_phase3_*.py
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/.pytest_cache/**,**/.venv*/**,**/chroma_db/**,**/chromadb/**,rag/target/**

# Coverage report generated by pytest-cov for Phase 3 suites
sonar.python.coverage.reportPaths=coverage-phase3.xml

# Keep focus on project code only
sonar.scm.exclusions.disabled=false
