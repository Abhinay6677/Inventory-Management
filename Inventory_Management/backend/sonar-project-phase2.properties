# SonarQube project metadata
sonar.projectKey=inventory-management-phase2
sonar.projectName=Inventory management phase 2
sonar.projectVersion=2.0

# Source encoding
sonar.sourceEncoding=UTF-8

# Python Phase 2 RAG scope
sonar.sources=rag
sonar.tests=rag/tests
sonar.test.inclusions=rag/tests/**/*.py
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/.pytest_cache/**,**/.venv*/**,**/chroma_db/**,rag/api_server.py

# Python coverage reports generated by pytest-cov
sonar.python.coverage.reportPaths=coverage-phase2.xml

# Keep focus on project code only
sonar.scm.exclusions.disabled=false
