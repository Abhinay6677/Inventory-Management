# SonarQube project metadata
sonar.projectKey=inventory-management-phase5
sonar.projectName=Inventory management phase 5
sonar.projectVersion=5.0

# Source encoding
sonar.sourceEncoding=UTF-8

# Phase 5 scope (multi-agent LangGraph runtime and Phase 5 test suites)
sonar.sources=multi_agent
sonar.tests=multi_agent/tests
sonar.test.inclusions=multi_agent/tests/test_phase5_*.py
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/.pytest_cache/**,**/.venv*/**,**/chroma_db/**,**/chromadb/**,multi_agent/target/**

# Coverage report generated by pytest-cov for Phase 5 suites
sonar.python.coverage.reportPaths=coverage-phase5.xml

# Keep focus on project code only
sonar.scm.exclusions.disabled=false
