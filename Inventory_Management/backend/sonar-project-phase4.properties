# SonarQube project metadata
sonar.projectKey=inventory-management-phase4
sonar.projectName=Inventory management phase 4
sonar.projectVersion=4.0

# Source encoding
sonar.sourceEncoding=UTF-8

# Phase 4 scope (MCP server runtime and Phase 4 test suites)
sonar.sources=mcp_server
sonar.tests=rag/tests
sonar.test.inclusions=rag/tests/test_phase4_*.py
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/.pytest_cache/**,**/.venv*/**,**/chroma_db/**,**/chromadb/**,rag/target/**

# Coverage report generated by pytest-cov for Phase 4 suites
sonar.python.coverage.reportPaths=coverage-phase4.xml

# Keep focus on project code only
sonar.scm.exclusions.disabled=false
