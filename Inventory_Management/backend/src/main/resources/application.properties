spring.application.name=Inventory_Management

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Abhi
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=inventory-management-secret-key-2026-very-long-secret-for-hs256-algorithm-poc07
jwt.expiration=86400000

# Logging
logging.level.com.InventoryManagement=DEBUG

# Real-time chat / Ollama
rag.ollama.enabled=true
rag.ollama.base-url=http://localhost:11434
rag.ollama.model=llama3.1
rag.ollama.timeout-seconds=15
