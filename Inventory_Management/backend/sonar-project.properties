# SonarQube project metadata
sonar.projectKey=inventory-management-phase1
sonar.projectName=Inventory Management Phase 1
sonar.projectVersion=1.4

# Source encoding
sonar.sourceEncoding=UTF-8

# Multi-stack sources
sonar.sources=src/main/java,frontend/src
sonar.tests=src/test/java,frontend/src
sonar.test.inclusions=src/test/java/**/*.java,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# Java settings
sonar.java.source=17
sonar.java.binaries=target/classes
sonar.junit.reportPaths=target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# TypeScript settings
sonar.typescript.tsconfigPath=frontend/tsconfig.json
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,frontend/src/**/*.d.ts

# Coverage scope tuning
# Intentionally left narrow to measure true backend/frontend coverage in Sonar way.

# Keep lowercase enum values for API/backward compatibility and ignore jwt Date-only API warning from jjwt.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S115
sonar.issue.ignore.multicriteria.e1.resourceKey=**/com/inventorymanagement/model/enums/*.java
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S2143
sonar.issue.ignore.multicriteria.e2.resourceKey=**/com/inventorymanagement/security/JwtUtil.java
